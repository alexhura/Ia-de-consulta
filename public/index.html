<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Consulta - Asistente de Desarrollo Web</title>
    <link rel="icon" type="image/png" href="/assets/images/ant-logo.png">
    <link rel="apple-touch-icon" href="/assets/images/ant-logo.png">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <div class="auth-header">
                    <img src="/assets/images/ant-logo.png" alt="Logo" class="auth-logo">
                    <h2>Iniciar Sesión</h2>
                    <p>Accede a tu asistente IA</p>
                </div>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label for="loginUsername">Usuario</label>
                        <input type="text" id="loginUsername" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                </form>
                <p class="auth-hint">Acceso autorizado por el administrador</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <div class="user-header">
            <div class="user-info">
                <img src="/assets/images/ant-logo.png" alt="IA Consulta Logo" class="logo-icon">
                <div>
                    <span class="user-name">IA Consulta</span>
                    <span class="user-profile" id="userProfile">Asistente de Desarrollo Web</span>
                </div>
            </div>
            <div class="user-actions">
                <span id="userDisplay" class="user-display"></span>
                <button id="adminBtn" class="header-btn header-btn-admin hidden" title="Panel de administración">👥 Usuarios</button>
                <button id="logoutBtn" class="header-btn header-btn-logout" title="Cerrar sesión">Salir</button>
                <button id="clearChatBtn" class="header-btn" title="Limpiar conversación">🗑️ Limpiar</button>
            </div>
        </div>
        
        <div class="container">
            <div class="hero" id="heroSection">
                <div class="badge">IA Consulta Chat</div>
                
                <div class="greeting">
                    <span class="icon">✺</span>
                    <h1 id="greetingText">¡Hola! ¿En qué te ayudo hoy?</h1>
                </div>
                
                <div class="input-container">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Pregúntame sobre cambios, mantenimiento, tiempos, productos..."
                        autocomplete="off"
                    />
                    <div class="input-actions">
                        <button id="sendButton" class="send-btn" title="Enviar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="quick-actions">
                    <button class="action-btn" data-query="¿Cómo funciona el proceso de solicitud de cambios?">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                        </svg>
                        Proceso Cambios
                    </button>
                    <button class="action-btn" data-query="¿Qué planes de mantenimiento ofrecen?">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        Mantenimiento
                    </button>
                    <button class="action-btn" data-query="¿Cuánto tarda desarrollar una web corporativa?">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        Tiempos
                    </button>
                    <button class="action-btn" data-query="¿Qué productos y servicios tienen?">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        Productos
                    </button>
                </div>
            </div>
            
            <div class="chat-section" id="chatSection">
                <button class="back-btn" id="backBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Nueva consulta
                </button>
                
                <div id="chatContainer" class="chat-container"></div>
                
                <div class="chat-input-container">
                    <input 
                        type="text" 
                        id="chatInput" 
                        placeholder="Escribe tu mensaje..."
                        autocomplete="off"
                    />
                    <button id="chatSendBtn" class="send-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel hidden">
            <div class="admin-header">
                <button class="back-btn" id="adminBackBtn">← Volver al chat</button>
                <h2>👥 Administración de Usuarios</h2>
            </div>

            <div class="admin-content">
                <div class="admin-card">
                    <h3>➕ Crear usuario</h3>
                    <form id="createUserForm" class="admin-form">
                        <div class="form-group">
                            <label for="newUsername">Usuario</label>
                            <input type="text" id="newUsername" required minlength="3" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">Contraseña</label>
                            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label for="newFullName">Nombre completo</label>
                            <input type="text" id="newFullName" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="newEmail">Email (opcional)</label>
                            <input type="email" id="newEmail" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="newRole">Rol</label>
                            <select id="newRole" class="admin-select">
                                <option value="call center">Call Center</option>
                                <option value="desarrollo">Desarrollo</option>
                                <option value="customer">Customer</option>
                                <option value="sales">Sales</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Crear usuario</button>
                    </form>
                    <p id="createUserMsg" class="admin-msg"></p>
                </div>

                <div class="admin-card">
                    <h3>📋 Usuarios existentes</h3>
                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Nombre</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                    <p id="usersMsg" class="admin-msg"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/chat.js"></script>
</body>
</html>
