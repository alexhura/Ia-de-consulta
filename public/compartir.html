<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir perfil de Google</title>
    <link rel="icon" type="image/png" href="/assets/images/logo-ant.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #111827;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(29, 78, 216, 0.15);
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
            border-top: 6px solid #1d4ed8;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .brand img { width: 38px; height: 38px; border-radius: 8px; }
        .brand h1 { font-size: 18px; font-weight: 700; color: #1d4ed8; }
        .project-name { font-size: 15px; color: #374151; margin-bottom: 6px; }
        .project-name span { color: #1d4ed8; font-weight: 600; }
        p.lead { font-size: 14px; color: #4b5563; line-height: 1.6; margin-bottom: 24px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            color: #111827;
            background: #ffffff;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
            margin-bottom: 12px;
        }
        input:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29, 78, 216, .15); }
        button {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: #1d4ed8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s ease;
        }
        button:hover { background: #1e40af; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: 14px; border-radius: 10px; padding: 12px 14px; display: none; }
        .msg.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .loading { text-align: center; color: #6b7280; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="/assets/images/logo-ant.png" alt="IA Consulta">
            <h1>Compartir perfil de Google</h1>
        </div>
        <div id="content">
            <div class="loading">Cargando proyecto...</div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('p');
            const content = document.getElementById('content');
            const api = '/api/share';

            if (!token) {
                content.innerHTML = '<div class="msg err" style="display:block">Enlace inválido.</div>';
                return;
            }

            fetch(api + '/project?p=' + encodeURIComponent(token))
                .then(r => r.json())
                .then(data => {
                    if (!data.success) throw new Error(data.error || 'Proyecto no encontrado');
                    renderForm(data.project);
                })
                .catch(err => {
                    content.innerHTML = '<div class="msg err" style="display:block">No se pudo cargar el proyecto: ' + (err.message || 'error') + '</div>';
                });

            function renderForm(p) {
                content.innerHTML = `
                    <p class="project-name">Proyecto: <span>${escapeHtml(p.business || p.client)}</span> · ${escapeHtml(p.client)}</p>
                    <p class="lead">Completa el enlace de tu perfil de negocio en Google y pulsa el botón para avisar al equipo.</p>
                    <label for="gName">Nombre del negocio</label>
                    <input type="text" id="gName" value="${escapeAttr(p.business || '')}" placeholder="Nombre del negocio en Google">
                    <label for="gUrl">Enlace del perfil de Google</label>
                    <input type="url" id="gUrl" placeholder="https://g.page/r/... o https://business.google.com/...">
                    <button type="button" id="shareBtn">Compartir</button>
                    <div class="msg" id="msg"></div>
                `;
                document.getElementById('shareBtn').addEventListener('click', () => doShare());
            }

            function doShare() {
                const url = document.getElementById('gUrl').value.trim();
                const profileName = document.getElementById('gName').value.trim();
                const msg = document.getElementById('msg');
                const btn = document.getElementById('shareBtn');
                if (!url || !/^https?:\/\//i.test(url)) {
                    msg.className = 'msg err';
                    msg.textContent = 'Pega un enlace de Google válido (debe comenzar con http:// o https://).';
                    return;
                }
                btn.disabled = true;
                msg.className = 'msg';
                fetch(api + '/link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, url: url, profileName: profileName })
                })
                    .then(r => r.json())
                    .then(data => {
                        if (!data.success) throw new Error(data.error || 'Error al enviar');
                        msg.className = 'msg ok';
                        msg.textContent = '¡Enviado! Hemos creado una tarea para revisar tu perfil.';
                        document.getElementById('gUrl').value = '';
                        btn.disabled = false;
                    })
                    .catch(err => {
                        msg.className = 'msg err';
                        msg.textContent = 'No se pudo enviar: ' + (err.message || 'error');
                        btn.disabled = false;
                    });
            }

            function escapeHtml(v) {
                const d = document.createElement('div');
                d.textContent = v == null ? '' : String(v);
                return d.innerHTML;
            }
            function escapeAttr(v) {
                return escapeHtml(v).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
        })();
    </script>
</body>
</html>
