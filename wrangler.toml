# Configuración de Cloudflare Workers + Static Assets.
# El deploy se hace con: npx wrangler login && npx wrangler deploy
# Los secretos se definen con: npx wrangler secret put <NOMBRE>
#   (GROQ_API_KEY, SUPABASE_API_KEY, JWT_SECRET)

name = "ia-consulta"
main = "dist/worker.js"
compatibility_date = "2026-08-28"
# El Worker ya viene bundleado por scripts/build-cf.mjs (no_bundle evita
# que wrangler lo re-empaquete y rompa deps como iconv-lite).
no_bundle = true
compatibility_flags = [
    "nodejs_compat",
    "enable_nodejs_http_modules",
    "enable_nodejs_http_server_modules",
    "experimental"
]

# Assets estáticos (frontend) servidos por Cloudflare directamente.
# Los requests a /api/* los intercepta el Worker y van a Express.
assets = { directory = "public", binding = "ASSETS", not_found_handling = "none" }

[vars]
NODE_ENV = "production"
GROQ_MODEL = "openai/gpt-oss-20b"
SUPABASE_URL = "https://pamzcgktgbzientqdprx.supabase.co"